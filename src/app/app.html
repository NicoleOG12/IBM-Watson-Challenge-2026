<!-- ============================================================
     app.html — Shell layout
     ============================================================ -->

<!-- ── TOPBAR ── -->
<app-navbar [engine]="engine()" />

<!-- ── MAIN SHELL ── -->
<div class="shell">
  <app-sidebar (navTo)="onNavChange($event)" />

  <!-- ── CHAT (única view implementada no mock) ── -->
  <app-chat *ngIf="activeNav() === 'chat'" />

  <!-- placeholder para outras rotas -->
  <div class="placeholder" *ngIf="activeNav() !== 'chat'">
    <div class="placeholder-inner">
      <div class="ph-icon">🚧</div>
      <div class="ph-title">{{ activeNav() }}</div>
      <div class="ph-desc">Página em desenvolvimento. Conecte o endpoint correspondente e implemente o componente.</div>
    </div>
  </div>

  <app-right-panel />
</div>

<!-- ── STATUS BAR ── -->
<app-status-bar />
